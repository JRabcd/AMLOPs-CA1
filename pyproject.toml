[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-buy-mlops"
version = "0.1.0"
description = "SP-buy fraud detection data and training utilities"
requires-python = ">=3.10"
dependencies = [
    "pymysql[rsa]>=1.2.4",
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "joblib",
    "mlflow==3.18.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
